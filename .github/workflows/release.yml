# Static musl binaries on a tag v*: zwave-bridge and zwave-sim for
#
#   x86_64-unknown-linux-musl    PCs, servers, VMs
#   aarch64-unknown-linux-musl   Raspberry Pi 3/4/5 and other arm64 gateways
#   mipsel-unknown-linux-musl    MT7628/MT7621-class OpenWrt routers
#
# Every target's test suite runs under qemu-user before anything is published.
# Run it by hand with a tag to build and publish that tag again with this
# workflow. Assets are built outside dist/, which is not ours to fill.

name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The version tag to build and publish (v0.2.0)
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  NIGHTLY: nightly-2026-11-14
  ZIG: 0.16.0
  ZIGBUILD: 0.24.1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: The tag is the crate version
        run: |
          want="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          [ "${TAG#v}" = "${want}" ] || { echo "tag ${TAG} is not v${want}" >&2; exit 1; }
      - uses: dtolnay/rust-toolchain@master
        timeout-minutes: 10
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: rust-src
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
        timeout-minutes: 10
        with:
          version: ${{ env.ZIG }}
      - uses: taiki-e/install-action@v2
        timeout-minutes: 10
        with:
          tool: cargo-zigbuild@${{ env.ZIGBUILD }}
      - name: qemu-user and mosquitto
        timeout-minutes: 10
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends qemu-user mosquitto file
      - name: Test and build
        env:
          RUSTUP_TOOLCHAIN: ${{ env.NIGHTLY }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUNNER: qemu-aarch64
          CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_MUSL_RUNNER: qemu-mipsel
          CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C target-feature=+crt-static -C link-self-contained=no
          ZWAVE_BRIDGE_REQUIRE_MQTT: "1"
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/assets"
          mkdir -p "${out}"
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl mipsel-unknown-linux-musl; do
            std=()
            case "${target}" in mips*) std=(-Zbuild-std) ;; esac
            cargo-zigbuild test --workspace --target "${target}" "${std[@]}"
            case "${target}" in mips*) std=(-Zbuild-std=std,panic_abort) ;; esac
            cargo zigbuild --release -p zwave-bridge -p zwave-sim --target "${target}" "${std[@]}"
            for bin in zwave-bridge zwave-sim; do
              f="target/${target}/release/${bin}"
              file "${f}" | grep -q 'statically linked' || { file "${f}"; echo "${target}: ${bin} not static" >&2; exit 1; }
              cp "${f}" "${out}/${bin}-${target%%-*}-linux-musl"
            done
          done
          (cd "${out}" && sha256sum *-linux-musl > SHA256SUMS && cat SHA256SUMS)
      - name: Release notes from the changelog
        run: |
          version="${TAG#v}"
          awk -v v="${version}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          [ -s "${RUNNER_TEMP}/notes.md" ] || { echo "no CHANGELOG section for ${version}" >&2; exit 1; }
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "${RUNNER_TEMP}/assets"
          gh release create "${TAG}" ./* --repo "${GITHUB_REPOSITORY}" --title "${TAG}" --notes-file "${RUNNER_TEMP}/notes.md" --verify-tag
