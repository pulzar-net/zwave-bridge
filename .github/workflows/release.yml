# Static musl binaries on a tag v*: zwave-bridge and zwave-sim for
#
#   x86_64-unknown-linux-musl    PCs, servers, VMs
#   aarch64-unknown-linux-musl   Raspberry Pi 3/4/5 and other arm64 gateways
#   mipsel-unknown-linux-musl    MT7628/MT7621-class OpenWrt routers
#
# Every target's test suite runs under qemu-user before anything is published.
# Run it by hand with a tag to build and publish that tag again with this
# workflow. Assets are built outside dist/, which is not ours to fill.

name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The version tag to build and publish (v0.2.0)
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  NIGHTLY: nightly-2026-11-14
  ZIG: 0.16.0
  ZIGBUILD: 0.24.1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: The tag is the crate version
        run: |
          want="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          [ "${TAG#v}" = "${want}" ] || { echo "tag ${TAG} is not v${want}" >&2; exit 1; }
      - uses: dtolnay/rust-toolchain@master
        timeout-minutes: 10
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: rust-src
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
        timeout-minutes: 10
        with:
          version: ${{ env.ZIG }}
      - uses: taiki-e/install-action@v2
        timeout-minutes: 10
        with:
          tool: cargo-zigbuild@${{ env.ZIGBUILD }}
      - name: qemu-user and mosquitto
        timeout-minutes: 10
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends qemu-user mosquitto file
      - name: Test and build
        env:
          RUSTUP_TOOLCHAIN: ${{ env.NIGHTLY }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUNNER: qemu-aarch64
          CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_MUSL_RUNNER: qemu-mipsel
          CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C target-feature=+crt-static -C link-self-contained=no
          ZWAVE_BRIDGE_REQUIRE_MQTT: "1"
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/assets"
          mkdir -p "${out}"
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl mipsel-unknown-linux-musl; do
            std=()
            case "${target}" in mips*) std=(-Zbuild-std) ;; esac
            cargo-zigbuild test --workspace --target "${target}" "${std[@]}"
            case "${target}" in mips*) std=(-Zbuild-std=std,panic_abort) ;; esac
            cargo zigbuild --release -p zwave-bridge -p zwave-sim --target "${target}" "${std[@]}"
            for bin in zwave-bridge zwave-sim; do
              f="target/${target}/release/${bin}"
              file "${f}" | grep -q 'statically linked' || { file "${f}"; echo "${target}: ${bin} not static" >&2; exit 1; }
              cp "${f}" "${out}/${bin}-${target%%-*}-linux-musl"
            done
          done
          (cd "${out}" && sha256sum *-linux-musl > SHA256SUMS && cat SHA256SUMS)
      - name: Release notes from the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The annotated tag's message (git tag -a vX.Y.Z --cleanup=whitespace
          # -F notes.md), else GitHub's generated notes; never none.
          set -euo pipefail
          notes="${RUNNER_TEMP}/notes.md"
          git fetch -q --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          : > "${notes}"
          if [ "$(git cat-file -t "refs/tags/${TAG}")" = tag ]; then
            git cat-file tag "refs/tags/${TAG}" | sed '1,/^$/d; /^-----BEGIN [A-Z ]*SIGNATURE-----$/,$d' > "${notes}"
          fi
          if ! awk -v t="${TAG}" 'NF && $0 != t { f = 1 } END { exit !f }' "${notes}"; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="${TAG}" -q .body > "${notes}"
            awk 'NF && !/Full Changelog/ { f = 1 } END { exit !f }' "${notes}" || {
              echo "::error::${TAG} has no release notes: tag it with git tag -a and the notes as its message"; exit 1; }
          fi
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "${RUNNER_TEMP}/assets"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "${TAG} is already released; its assets stay as they are"
            exit 0
          fi
          gh release create "${TAG}" ./* --repo "${GITHUB_REPOSITORY}" --title "${TAG}" --notes-file "${RUNNER_TEMP}/notes.md" --verify-tag

  # The crates on crates.io, in dependency order, once the binaries are out.
  # A version already there is skipped, so a re-run finishes the rest. With
  # the TRUSTED_PUBLISHING variable set to true, the token comes from
  # crates.io trusted publishing; otherwise from the CARGO_REGISTRY_TOKEN
  # secret.
  crates:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # A first publish of several new crates waits out crates.io's rate limit
    # on new crates, shared with the account's other repositories.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 10
      - name: Trusted publishing token
        id: oidc
        if: vars.TRUSTED_PUBLISHING == 'true'
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.oidc.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::notice::No crates.io token (trusted publishing or CARGO_REGISTRY_TOKEN); the crates were not published."
            exit 0
          fi
          version="${TAG#v}"
          for crate in zwave-serial zwave-security zwave-cc zwave-sim zwave-host zwave-bridge; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -A 'zwave-bridge release (github.com/pulzar-net/zwave-bridge)' \
              "https://crates.io/api/v1/crates/${crate}/${version}")
            if [ "${code}" = 200 ]; then
              echo "${crate} ${version} is already on crates.io"
              continue
            fi
            # crates.io limits how many new crates an account publishes in a
            # while and answers 429 with the time to try again; wait until then.
            for attempt in $(seq 1 12); do
              if cargo publish -p "${crate}" --locked 2>&1 | tee "${RUNNER_TEMP}/publish.log"; then
                break
              fi
              when="$(grep -o 'try again after [A-Z][a-z][a-z], [0-9]* [A-Z][a-z]* [0-9]* [0-9:]* GMT' "${RUNNER_TEMP}/publish.log" | head -1 | sed 's/^try again after //')"
              [ -n "${when}" ] && [ "${attempt}" -lt 12 ] || exit 1
              wait=$(( $(date -d "${when}" +%s) - $(date +%s) + 15 ))
              echo "crates.io asks to wait until ${when}; waiting ${wait}s"
              [ "${wait}" -le 0 ] || sleep "${wait}"
            done
          done
