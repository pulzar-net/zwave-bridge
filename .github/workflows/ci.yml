name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NIGHTLY: nightly-2026-11-14
  ZIG: 0.16.0
  ZIGBUILD: 0.24.1

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 10
        with:
          components: rustfmt, clippy
      - name: Mosquitto for the MQTT end-to-end test
        timeout-minutes: 10
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends mosquitto
      - name: Latest @zwave-js/config, to load every device file
        timeout-minutes: 5
        run: |
          set -euo pipefail
          v=$(curl -sf https://registry.npmjs.org/@zwave-js/config/latest | jq -r .version)
          echo "@zwave-js/config ${v}"
          curl -sfL "https://registry.npmjs.org/@zwave-js/config/-/config-${v}.tgz" | tar -xz -C "${RUNNER_TEMP}"
          echo "ZWAVE_JS_CONFIG_DIR=${RUNNER_TEMP}/package/config/devices" >> "${GITHUB_ENV}"
          echo "ZWAVE_JS_CONFIG_REQUIRED=1" >> "${GITHUB_ENV}"
      - name: Real controller backups (Z-Wave JS's NVM test images), for the NVM3 reader
        timeout-minutes: 5
        run: |
          set -euo pipefail
          d="${RUNNER_TEMP}/nvm"
          mkdir -p "$d/nvm_700_binary" "$d/nvm_700_json"
          base=https://raw.githubusercontent.com/zwave-js/zwave-js/master/packages/nvmedit/test/fixtures
          for f in 7.11 7.12 7.15 7.16_1 7.16_2 7.17.2 7.18.1 7.18.2 7.18.3 7.18.4 7.19.0 7.19.1; do
            curl -sfL "$base/nvm_700_binary/ctrlr_backup_700_$f.bin" -o "$d/nvm_700_binary/ctrlr_backup_700_$f.bin"
          done
          curl -sfL "$base/nvm_700_binary/ctrlr_backup_800_7.23.0.bin" -o "$d/nvm_700_binary/ctrlr_backup_800_7.23.0.bin"
          for f in 7.11 7.12 7.15.2 7.16.2 7.17.2 7.18.1 7.18.2 7.18.3 7.18.4 7.19.0 7.19.1; do
            curl -sfL "$base/nvm_700_json/ctrlr_backup_700_$f.json" -o "$d/nvm_700_json/ctrlr_backup_700_$f.json"
          done
          echo "ZWAVE_JS_NVM_DIR=$d" >> "${GITHUB_ENV}"
          echo "ZWAVE_JS_NVM_REQUIRED=1" >> "${GITHUB_ENV}"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          ZWAVE_BRIDGE_REQUIRE_MQTT: "1"
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # A short run of every fuzz target, so a parser that panics fails the build.
  # What crates.io would get: every crate packaged and built from its
  # package alone, in dependency order (unpublished ones from the others).
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 10
      - run: cargo package --workspace --locked
      - name: No more than the crates need
        run: |
          set -euo pipefail
          for c in target/package/*.crate; do
            size=$(stat -c %s "${c}")
            echo "${c##*/}: ${size} bytes"
            [ "${size}" -le 400000 ] || { echo "${c} is over 400 KB; check include" >&2; exit 1; }
          done

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        timeout-minutes: 10
        with:
          toolchain: ${{ env.NIGHTLY }}
      - uses: taiki-e/install-action@v2
        timeout-minutes: 10
        with:
          tool: cargo-fuzz
      - name: Fuzz each target for 30 s
        run: |
          set -euo pipefail
          cd fuzz
          for t in $(cargo +${NIGHTLY} fuzz list); do
            echo "::group::${t}"
            cargo +${NIGHTLY} fuzz run --target x86_64-unknown-linux-gnu "${t}" -- -max_total_time=30 -rss_limit_mb=1024
            echo "::endgroup::"
          done

  # Static musl builds for gateways, with the tests run under qemu, and the
  # size budget checked. mipsel is a tier 3 target: std is built from source
  # on a pinned nightly and linked against zig's musl.
  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-unknown-linux-musl, mipsel-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        timeout-minutes: 10
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: rust-src
          targets: aarch64-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
        timeout-minutes: 10
        with:
          version: ${{ env.ZIG }}
      - uses: taiki-e/install-action@v2
        timeout-minutes: 10
        with:
          tool: cargo-zigbuild@${{ env.ZIGBUILD }}
      - name: qemu-user and mosquitto
        timeout-minutes: 10
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends qemu-user mosquitto file
      - name: Test under qemu, build, check static and size
        env:
          TARGET: ${{ matrix.target }}
          RUSTUP_TOOLCHAIN: ${{ env.NIGHTLY }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUNNER: qemu-aarch64
          CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_MUSL_RUNNER: qemu-mipsel
          CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C target-feature=+crt-static -C link-self-contained=no
          ZWAVE_BRIDGE_REQUIRE_MQTT: "1"
        run: |
          set -euo pipefail
          std=()
          case "${TARGET}" in mips*) std=(-Zbuild-std) ;; esac
          cargo-zigbuild test --workspace --target "${TARGET}" "${std[@]}"
          case "${TARGET}" in mips*) std=(-Zbuild-std=std,panic_abort) ;; esac
          cargo zigbuild --release -p zwave-bridge -p zwave-sim --target "${TARGET}" "${std[@]}"
          runner="CARGO_TARGET_$(echo "${TARGET}" | tr 'a-z-' 'A-Z_')_RUNNER"
          for bin in zwave-bridge zwave-sim; do
            f="target/${TARGET}/release/${bin}"
            file "${f}" | grep -q 'statically linked' || { file "${f}"; echo "${bin} is not static" >&2; exit 1; }
            "${!runner}" "${f}" --version
            size=$(stat -c %s "${f}")
            echo "${bin}: ${size} bytes"
          done
          size=$(stat -c %s "target/${TARGET}/release/zwave-bridge")
          [ "${size}" -lt 4194304 ] || { echo "zwave-bridge is ${size} bytes, over the 4 MiB budget" >&2; exit 1; }
