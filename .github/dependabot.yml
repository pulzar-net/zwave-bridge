# Rust crates (the workspace and the fuzz crate) and GitHub Actions are
# bumped weekly in one grouped pull request each; CI gates every bump.
version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/", "/fuzz"]
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # The docs site: the Pulzr docs theme, Astro and Starlight, in one pull request.
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    groups:
      docs:
        patterns: ["*"]
