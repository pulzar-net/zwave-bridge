[package]
name = "zwave-security"
description = "Z-Wave S0 and S2 security for host stacks: key exchange, SPAN/MPAN nonces, encapsulation, DSK and SmartStart provisioning"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/zwave-security"
readme = "README.md"
keywords = ["zwave", "z-wave", "security", "s2", "iot"]
categories = ["cryptography", "embedded"]
# What crates.io gets: no fuzz corpora, docs site or packaging files.
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE", "NOTICE"]

[dependencies]
aes = "0.9"
cmac = "0.8"
ccm = { version = "0.6", default-features = false, features = ["alloc"] }
ofb = "0.7"
cbc-mac = "0.2"
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "zeroize"] }
getrandom = "0.3"
sha1 = { version = "0.11", default-features = false }
zeroize = { version = "1", features = ["derive"] }
thiserror.workspace = true
serde = { workspace = true, optional = true }

[features]
serde = ["dep:serde"]

[dev-dependencies]
hex.workspace = true

[lints]
workspace = true
