[package]
name = "zwave-sim"
description = "A Z-Wave Serial API controller simulator with simulated nodes (S0, S2, sleeping, SmartStart), for testing host stacks without hardware"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/zwave-sim"
readme = "README.md"
keywords = ["zwave", "z-wave", "simulator", "testing"]
categories = ["development-tools::testing", "simulation"]
# What crates.io gets: no fuzz corpora, docs site or packaging files.
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE", "NOTICE"]

[[bin]]
name = "zwave-sim"
path = "src/bin/zwave-sim.rs"

[dependencies]
zwave-serial.workspace = true
zwave-security.workspace = true
zwave-cc.workspace = true
bytes.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "io-util", "io-std", "sync", "time", "macros"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
# Path only, so publishing drops it (zwave-host's own tests use this crate).
zwave-host = { path = "../zwave-host" }
tempfile = "3"
tokio = { workspace = true, features = ["process"] }

[lints]
workspace = true
