id = 0x72
name = "manufacturer_specific"
title = "Manufacturer Specific"
version = 2

[[command]]
id = 0x04
name = "get"

[[command]]
id = 0x05
name = "report"
fields = [
  { name = "manufacturer_id", type = "u16" },
  { name = "product_type", type = "u16" },
  { name = "product_id", type = "u16" },
]

[[command]]
id = 0x06
name = "device_specific_get"
fields = [{ type = "bits", parts = [{ name = "device_id_type", shift = 0, width = 3 }] }]

[[command]]
id = 0x07
name = "device_specific_report"
fields = [
  { type = "bits", parts = [{ name = "device_id_type", shift = 0, width = 3 }] },
  { type = "bits", parts = [
    { name = "data_format", shift = 5, width = 3 },
    { name = "data_len", shift = 0, width = 5 },
  ] },
  { name = "data", type = "bytes", len = "data_len" },
]
