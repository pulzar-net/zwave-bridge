id = 0x32
name = "meter"
title = "Meter"
version = 6

[[command]]
id = 0x01
name = "get"
fields = [
  { type = "bits", optional = true, parts = [
    { name = "rate_type", shift = 6, width = 2 },
    { name = "scale", shift = 3, width = 3 },
  ] },
  { name = "scale2", type = "u8", optional = true },
]

# The meter type byte carries bit 2 of the scale; the value's own scale
# field carries bits 0-1. A scale of 7 means "see scale2" (version 4+).
[[command]]
id = 0x02
name = "report"
fields = [
  { type = "bits", parts = [
    { name = "scale_bit2", shift = 7, width = 1, kind = "bool" },
    { name = "rate_type", shift = 5, width = 2 },
    { name = "meter_type", shift = 0, width = 5 },
  ] },
  { name = "value", type = "value" },
  { name = "delta_time", type = "u16", optional = true },
  { name = "previous_value", type = "sized", size = "value", optional = true, when = "delta_time" },
  { name = "scale2", type = "u8", optional = true },
]

[[command]]
id = 0x03
name = "supported_get"

[[command]]
id = 0x04
name = "supported_report"
fields = [
  { type = "bits", parts = [
    { name = "meter_reset", shift = 7, width = 1, kind = "bool" },
    { name = "rate_type", shift = 5, width = 2 },
    { name = "meter_type", shift = 0, width = 5 },
  ] },
  { type = "bits", parts = [
    { name = "more_scale_types", shift = 7, width = 1, kind = "bool" },
    { name = "scales", shift = 0, width = 7 },
  ] },
  { name = "extra_scales", type = "bytes" },
]

[[command]]
id = 0x05
name = "reset"
fields = [{ name = "data", type = "bytes" }]
