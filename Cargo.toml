[workspace]
resolver = "2"
members = [
    "crates/zwave-serial",
    "crates/zwave-security",
    "crates/zwave-cc",
    "crates/zwave-host",
    "crates/zwave-sim",
    "crates/zwave-bridge",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.2.2"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/pulzar-net/zwave-bridge"
homepage = "https://oss.pulzr.net/zwave-bridge/"
authors = ["Pulzar LLC"]

[workspace.dependencies]
zwave-serial = { path = "crates/zwave-serial", version = "0.2.2", default-features = false }
zwave-security = { path = "crates/zwave-security", version = "0.2.2" }
zwave-cc = { path = "crates/zwave-cc", version = "0.2.2" }
zwave-host = { path = "crates/zwave-host", version = "0.2.2" }
zwave-sim = { path = "crates/zwave-sim", version = "0.2.2" }
thiserror = "2"
tokio = { version = "1.54", default-features = false }
tokio-util = { version = "0.7", default-features = false, features = ["codec"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
hex = "0.4"

# The MQTT reference (tests/asyncapi.rs, the zwave-bridge feature
# unstable-asyncapi-docs) needs what no asyncapi-rust release has yet:
# channel and operation messages (upstream main, mlilback/asyncapi-rust#17),
# and channel and operation descriptions, titles and summaries (our fork,
# offered upstream as mlilback/asyncapi-rust#27 and #28). Pinned to
# pulzar-net/asyncapi-rust, which is never published. Default and release
# builds never use asyncapi-rust, and `cargo publish` ignores this patch.
# Remove it once a release has all three.
[patch.crates-io]
asyncapi-rust = { git = "https://github.com/pulzar-net/asyncapi-rust", rev = "d62a75517859cc031a3f716df86e64d6406040d1" }
asyncapi-rust-codegen = { git = "https://github.com/pulzar-net/asyncapi-rust", rev = "d62a75517859cc031a3f716df86e64d6406040d1" }
asyncapi-rust-models = { git = "https://github.com/pulzar-net/asyncapi-rust", rev = "d62a75517859cc031a3f716df86e64d6406040d1" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
