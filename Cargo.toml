[workspace]
resolver = "2"
members = [
    "crates/zwave-serial",
    "crates/zwave-security",
    "crates/zwave-cc",
    "crates/zwave-host",
    "crates/zwave-sim",
    "crates/zwave-bridge",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/pulzar-net/zwave-bridge"
authors = ["Pulzar LLC"]

[workspace.dependencies]
zwave-serial = { path = "crates/zwave-serial", version = "0.1.0", default-features = false }
zwave-security = { path = "crates/zwave-security", version = "0.1.0" }
zwave-cc = { path = "crates/zwave-cc", version = "0.1.0" }
zwave-host = { path = "crates/zwave-host", version = "0.1.0" }
zwave-sim = { path = "crates/zwave-sim", version = "0.1.0" }
thiserror = "2"
tokio = { version = "1.54", default-features = false }
tokio-util = { version = "0.7", default-features = false, features = ["codec"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
hex = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
